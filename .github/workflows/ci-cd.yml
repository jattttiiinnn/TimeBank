name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18.x'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies (client)
      run: npm ci

    - name: Install dependencies (server)
      run: |
        if [ -f "server/package.json" ]; then
          cd server
          npm ci
        else
          echo "No server package.json found, skipping server dependencies"
        fi

    - name: Lint code
      run: npm run lint

    - name: Build client
      run: npm run build

    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: |
          dist/
          node_modules/
          server/node_modules/
        key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}

  deploy-firebase:
    name: Deploy to Firebase
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: |
          dist/
          node_modules/
          server/node_modules/
        key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}

    - name: Install dependencies if cache miss
      run: |
        if [ ! -d "node_modules" ]; then npm ci; fi
        if [ ! -d "server/node_modules" ]; then cd server && npm ci; fi

    - name: Build project
      run: npm run build

    - name: Install Firebase CLI
      run: npm install -g firebase-tools

    - name: Deploy to Firebase Hosting
      run: firebase deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }}

  deploy-render:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Trigger Render Deploy
      run: |
        curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

  notify:
    name: Notify Deployment Status
    needs: [deploy-firebase, deploy-render]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Notify Success
      if: needs.deploy-firebase.result == 'success' && needs.deploy-render.result == 'success'
      run: |
        echo "✅ Deployment successful to both Firebase and Render!"
        
    - name: Notify Failure
      if: needs.deploy-firebase.result == 'failure' || needs.deploy-render.result == 'failure'
      run: |
        echo "❌ Deployment failed. Check logs for details."
